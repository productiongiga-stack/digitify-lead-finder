<!DOCTYPE html>
<html lang="nl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digitify Suite</title>
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="ds-app">

    <!-- ── Sidebar ──────────────────────────────────────── -->
    <aside class="ds-sidebar">
      <div class="ds-sidebar-brand">
        <div class="ds-brand-logo">D</div>
        <span class="ds-brand-name">Digitify Suite</span>
      </div>

      <nav class="ds-nav">
        <a href="#dashboard" class="ds-nav-item active" data-module="dashboard">
          <svg class="ds-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          <span>Dashboard</span>
        </a>
        <a href="#crm" class="ds-nav-item" data-module="crm">
          <svg class="ds-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>CRM</span>
        </a>
        <a href="#leads" class="ds-nav-item" data-module="leads">
          <svg class="ds-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          <span>Leads</span>
        </a>
        <a href="#booking" class="ds-nav-item" data-module="booking">
          <svg class="ds-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/></svg>
          <span>Booking</span>
        </a>
        <a href="#agenda" class="ds-nav-item" data-module="agenda">
          <svg class="ds-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span>Agenda</span>
        </a>
        <a href="#offertes" class="ds-nav-item" data-module="offertes">
          <svg class="ds-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          <span>Offertes</span>
        </a>
        <a href="#companies" class="ds-nav-item" data-module="companies">
          <svg class="ds-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>Bedrijven</span>
        </a>
        <a href="#settings" class="ds-nav-item" data-module="settings">
          <svg class="ds-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Instellingen</span>
        </a>
      </nav>

      <!-- Company Switcher -->
      <div class="ds-sidebar-footer">
        <div class="ds-company-switcher">
          <div class="ds-company-avatar">D</div>
          <div class="ds-company-info">
            <span class="ds-company-name">Digitify</span>
            <span class="ds-company-label">Workspace</span>
          </div>
          <svg class="ds-company-chevron" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>
    </aside>

    <!-- ── Main Content ─────────────────────────────────── -->
    <main class="ds-main">
      <header class="ds-topbar">
        <h1 class="ds-topbar-title" id="ds-topbar-title">Dashboard</h1>
        <div class="ds-topbar-actions">
          <button class="ds-btn ds-btn--ghost ds-topbar-search-btn" id="ds-global-search-btn" title="Zoeken">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </button>
        </div>
      </header>

      <div class="ds-content" id="ds-module-content">
        <!-- Modules render here -->
      </div>
    </main>

  </div>

  <!-- Modal container -->
  <div class="ds-modal-overlay" id="ds-modal-overlay">
    <div class="ds-modal" id="ds-modal">
      <div class="ds-modal-header">
        <h2 class="ds-modal-title" id="ds-modal-title"></h2>
        <button class="ds-modal-close" id="ds-modal-close">&times;</button>
      </div>
      <div class="ds-modal-body" id="ds-modal-body"></div>
    </div>
  </div>

  <!-- Toast container -->
  <div class="ds-toast-container" id="ds-toast-container"></div>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
